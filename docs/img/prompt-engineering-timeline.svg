<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="timeline-title timeline-desc">
  <title id="timeline-title">Prompt Engineering Skill Progression Timeline</title>
  <desc id="timeline-desc">Timeline showing prompt engineering skill progression over 47 days: starting at 0/10 on Day 1 with broken code, reaching 2/10 by week's end with basic MVP, 5/10 by Day 21 with UX improvements, jumping to 7/10 on Day 22 with CLAUDE.md breakthrough, 9/10 around Day 35 after architecture migration, and 9.5/10 by Day 47 with production-ready code</desc>

  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Axes -->
  <g stroke="#374151" stroke-width="3" fill="none">
    <line x1="80" y1="60" x2="80" y2="440"/>
    <line x1="80" y1="440" x2="770" y2="440"/>
  </g>

  <!-- X-axis labels (Days) - simplified, larger font -->
  <g font-family="-apple-system, system-ui, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="600">
    <text x="180" y="470">Day 7</text>
    <text x="425" y="470">Day 22</text>
    <text x="730" y="470">Day 47</text>
  </g>

  <!-- Data line -->
  <polyline points="100,440 180,364 390,250 410,174 600,98 720,79"
            fill="none" stroke="#374151" stroke-width="5" stroke-linejoin="round"/>

  <!-- Data points with score labels directly on them -->
  <g font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700">
    <!-- Day 1: 0/10 -->
    <circle cx="100" cy="440" r="12" fill="#374151" stroke="#ffffff" stroke-width="3"/>

    <!-- Day 7: 2/10 -->
    <circle cx="180" cy="364" r="12" fill="#374151" stroke="#ffffff" stroke-width="3"/>
    <text x="180" y="396" text-anchor="middle" fill="#111827" font-size="24" font-style="italic">2</text>

    <!-- Day 21: 5/10 -->
    <circle cx="390" cy="250" r="12" fill="#374151" stroke="#ffffff" stroke-width="3"/>
    <text x="390" y="282" text-anchor="middle" fill="#111827" font-size="24" font-style="italic">5</text>

    <!-- Day 22: 7/10 - BREAKTHROUGH -->
    <circle cx="410" cy="174" r="18" fill="#116ef6" stroke="#ffffff" stroke-width="4"/>
    <text x="410" y="154" text-anchor="middle" fill="#374151" font-style="italic">7</text>
    <text x="762" y="424" text-anchor="end" fill="#116ef6" font-size="24">CLAUDE.md</text>

    <!-- Day 35: 9/10 -->
    <circle cx="600" cy="98" r="12" fill="#374151" stroke="#ffffff" stroke-width="3"/>
    <text x="600" y="130" text-anchor="middle" fill="#111827" font-size="24" font-style="italic">9</text>

    <!-- Day 47: 9.5/10 -->
    <circle cx="720" cy="79" r="12" fill="#374151" stroke="#ffffff" stroke-width="3"/>
    <text x="720" y="111" text-anchor="middle" fill="#374151" font-style="italic">9.5</text>
  </g>
</svg>
